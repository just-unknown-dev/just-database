name: Flutter CI

# Pushes to main, dev and release branches (release/x.y.z), and pull requests
# into main or dev.
on:
  push:
    branches: [ "main", "dev", "release/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # The lowest Flutter the package supports is 3.47.1; test on the
          # release the workspace pins.
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run web tests (Chrome)
        # IndexedDB and WebCrypto: the web store and encrypted databases.
        run: flutter test --platform chrome test/web

      - name: Check the package can be published
        run: flutter pub publish --dry-run
