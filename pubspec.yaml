name: just_database
description: "A pure-Dart SQL database for Flutter: SQLite-style SQL, transactions, triggers, views, foreign keys, AES-256-GCM encryption, migrations and an admin UI."
version: 2.0.0
homepage: https://github.com/just-unknown-dev/just-database
repository: https://github.com/just-unknown-dev/just-database
issue_tracker: https://github.com/just-unknown-dev/just-database/issues
topics:
  - database
  - sql
  - storage
  - encryption
  - persistence

screenshots:
  - description: "The admin workbench on a desktop: databases and tables in the sidebar, a sorted table, and a row in the side-panel editor."
    path: assets/screenshots/workbench_desktop.png
  - description: "The admin workbench on phones: a database's tables, a table's rows, and a query in the SQL console."
    path: assets/screenshots/workbench_phone.png
  - description: "The admin workbench in light mode: a parameterised query with highlighting, and its results."
    path: assets/screenshots/workbench_desktop_light.png

environment:
  sdk: ^3.11.0
  flutter: ">=3.47.1"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  just_storage: ^2.0.0
  path_provider: ^2.1.5
  # 3.x too, so apps that pin pointycastle 3 can still use this package.
  pointycastle: ">=3.7.3 <5.0.0"
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.0
